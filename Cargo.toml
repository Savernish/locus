[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Enbiya <your-email>"]
repository = "https://github.com/<you>/locus"
rust-version = "1.75"

[workspace.dependencies]
nalgebra = "0.33"
num-complex = "0.4"
num-traits = "0.2"
petgraph = "0.6"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
ron = "0.8"
approx = "0.5"

[profile.release]
lto = "thin"
codegen-units = 1
